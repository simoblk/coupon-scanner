<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scanner - GitHub Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #030712; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(12px); }
        .success-badge { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-5xl mx-auto">
        <header class="text-center py-10">
            <h1 class="text-5xl font-black text-white italic">SMART<span class="text-emerald-500 font-serif">SCAN</span></h1>
            <p class="text-slate-400 mt-2">Legal Price Comparison & Coupon Validator</p>
        </header>

        <div class="glass p-8 rounded-[2rem] flex flex-col md:flex-row gap-4 mb-12 shadow-2xl">
            <input type="text" id="pInput" placeholder="iPhone, Nike, Airpods..." class="flex-1 bg-slate-900/50 border border-slate-700 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="scan()" class="bg-emerald-600 px-10 py-4 rounded-2xl font-black text-black hover:scale-105 transition-all">SCAN DEALS</button>
        </div>

        <div id="loader" class="hidden text-center text-emerald-500 font-bold mb-10 animate-pulse">Checking Jumia & Verified Sources...</div>
        <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </div>

    <script>
        const KOYEB_URL = "https://wise-frances-mohammedbelkahia-1d2d94e6.koyeb.app/"; // Update this!

        async function scan() {
            const q = document.getElementById('pInput').value;
            const resDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            if(!q) return;
            loader.classList.remove('hidden');
            resDiv.innerHTML = "";

            try {
                const data = await fetch(`${KOYEB_URL}/api/search?q=${q}`).then(r => r.json());
                loader.classList.add('hidden');
                resDiv.innerHTML = `
                    <div class="glass p-8 rounded-3xl border-l-8 border-emerald-500">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-xs font-bold text-slate-400 uppercase">${data.store}</span>
                            <a href="${data.url}" target="_blank" title="Source Link"><i class="fas fa-external-link-alt text-slate-500"></i></a>
                        </div>
                        <div class="text-4xl font-black text-white mb-6">${data.price} <span class="text-sm">MAD</span></div>
                        <div class="success-badge px-3 py-1 rounded-full text-[10px] inline-block font-bold mb-4">PRICE VERIFIED</div>
                    </div>
                    <div class="space-y-4">
                        ${data.coupons.map(c => `
                            <div class="glass p-4 rounded-2xl flex justify-between items-center border-dashed border-slate-700 border-2">
                                <div>
                                    <div class="text-xs font-bold text-emerald-400 font-mono">${c.code}</div>
                                    <div class="text-[10px] text-slate-500 truncate w-40">${c.title}</div>
                                </div>
                                <button onclick="navigator.clipboard.writeText('${c.code}'); window.open('${c.link}')" class="bg-emerald-500 text-black px-4 py-2 rounded-lg text-[10px] font-black hover:bg-white transition-all">COPY & TEST</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch(e) { loader.classList.add('hidden'); resDiv.innerHTML = "<p class='text-red-400'>Error connecting to Backend.</p>"; }
        }
    </script>
</body>
</html>
